<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Terminal: Aditya Trivedi, compiler engineer on the ARM LLVM team at Qualcomm, Hyderabad">
  <defs>
    <style>
      .t { font-family: SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 16px; fill: #c9d1d9; }
      .muted { fill: #8b949e; }
      .prompt { fill: #3fb950; }
      .flag { fill: #79c0ff; }
      .name { font-size: 30px; font-weight: 700; fill: #e6edf3; }
      .tag { font-size: 14px; }
    </style>
  </defs>
  <rect width="900" height="360" rx="12" fill="#0d1117"/>
  <rect width="900" height="38" rx="12" fill="#161b22"/>
  <rect y="26" width="900" height="12" fill="#161b22"/>
  <circle cx="24" cy="19" r="6" fill="#f85149"/>
  <circle cx="46" cy="19" r="6" fill="#d29922"/>
  <circle cx="68" cy="19" r="6" fill="#3fb950"/>
  <text x="450" y="24" text-anchor="middle" class="t muted" font-size="13">aditya@qualcomm: ~</text>

  <text x="40" y="80" class="t"><tspan class="prompt">$</tspan> whoami</text>
  <text x="40" y="124" class="t name">Aditya Trivedi</text>
  <text x="40" y="152" class="t muted">compiler engineer · ARM LLVM team @ Qualcomm · Hyderabad</text>

  <text x="40" y="196" class="t"><tspan class="prompt">$</tspan> cat ~/interests</text>
  <g class="t tag">
    <rect x="40" y="208" width="58" height="24" rx="12" fill="#1f6feb33" stroke="#1f6feb"/>
    <text x="69" y="225" text-anchor="middle" fill="#79c0ff">llvm</text>
    <rect x="108" y="208" width="58" height="24" rx="12" fill="#1f6feb33" stroke="#1f6feb"/>
    <text x="137" y="225" text-anchor="middle" fill="#79c0ff">mlir</text>
    <rect x="176" y="208" width="84" height="24" rx="12" fill="#1f6feb33" stroke="#1f6feb"/>
    <text x="218" y="225" text-anchor="middle" fill="#79c0ff">clangir</text>
    <rect x="270" y="208" width="84" height="24" rx="12" fill="#23863633" stroke="#238636"/>
    <text x="312" y="225" text-anchor="middle" fill="#3fb950">aarch64</text>
    <rect x="364" y="208" width="76" height="24" rx="12" fill="#23863633" stroke="#238636"/>
    <text x="402" y="225" text-anchor="middle" fill="#3fb950">sve/sme</text>
    <rect x="450" y="208" width="76" height="24" rx="12" fill="#9e6a0333" stroke="#9e6a03"/>
    <text x="488" y="225" text-anchor="middle" fill="#d29922">openmp</text>
    <rect x="536" y="208" width="50" height="24" rx="12" fill="#9e6a0333" stroke="#9e6a03"/>
    <text x="561" y="225" text-anchor="middle" fill="#d29922">mpi</text>
    <rect x="596" y="208" width="50" height="24" rx="12" fill="#9e6a0333" stroke="#9e6a03"/>
    <text x="621" y="225" text-anchor="middle" fill="#d29922">hpc</text>
    <rect x="656" y="208" width="84" height="24" rx="12" fill="#8957e533" stroke="#8957e5"/>
    <text x="698" y="225" text-anchor="middle" fill="#d2a8ff">fortran</text>
  </g>

  <text x="40" y="272" class="t"><tspan class="prompt">$</tspan> aditya --help</text>
  <text x="40" y="300" class="t" xml:space="preserve"><tspan class="flag">--make-it-faster</tspan>   <tspan class="flag">--read-the-asm</tspan>   <tspan class="flag">--why-didnt-it-vectorize</tspan></text>

  <text x="40" y="336" class="t prompt">$</text>
  <rect x="58" y="322" width="10" height="18" fill="#c9d1d9">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
