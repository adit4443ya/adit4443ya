<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs>
<rect width="900" height="520" rx="12" fill="#0d1117"/>
<text x="450.0" y="34" fill="#c9d1d9" font-size="18" font-weight="bold" text-anchor="middle">Is it a compiler bug?  a field guide</text>
<rect x="455.0" y="57.0" width="330" height="46" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.6"/><text x="620" y="85" fill="#c9d1d9" text-anchor="middle">something is wrong</text>
<line x1="620" y1="103" x2="620" y2="140" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="455.0" y="142.0" width="330" height="46" rx="8" fill="#161b22" stroke="#79c0ff" stroke-width="1.6"/><text x="620" y="170" fill="#c9d1d9" text-anchor="middle">does it vanish at -O0?</text>
<line x1="455" y1="165" x2="370" y2="165" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/><text x="415" y="157" fill="#d29922" font-size="13">no</text>
<rect x="70.0" y="138.0" width="300" height="54" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/><text x="220" y="161" fill="#c9d1d9" text-anchor="middle">your bug.</text><text x="220" y="180" fill="#8b949e" font-size="13" text-anchor="middle">sorry. it happens to everyone.</text>
<line x1="620" y1="188" x2="620" y2="230" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/><text x="628" y="214" fill="#d29922" font-size="13">yes</text>
<rect x="455.0" y="232.0" width="330" height="46" rx="8" fill="#161b22" stroke="#79c0ff" stroke-width="1.6"/><text x="620" y="260" fill="#c9d1d9" text-anchor="middle">ubsan / asan fire?</text>
<line x1="455" y1="255" x2="370" y2="255" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/><text x="415" y="247" fill="#d29922" font-size="13">yes</text>
<rect x="70.0" y="228.0" width="300" height="54" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/><text x="220" y="251" fill="#c9d1d9" text-anchor="middle">UB.</text><text x="220" y="270" fill="#8b949e" font-size="13" text-anchor="middle">the compiler assumed you were joking.</text>
<line x1="620" y1="278" x2="620" y2="320" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/><text x="628" y="304" fill="#d29922" font-size="13">no</text>
<rect x="455.0" y="322.0" width="330" height="46" rx="8" fill="#161b22" stroke="#79c0ff" stroke-width="1.6"/><text x="620" y="350" fill="#c9d1d9" text-anchor="middle">creduce it. bisect the pass.</text>
<line x1="620" y1="368" x2="620" y2="410" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="455.0" y="408.0" width="330" height="54" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.6"/><text x="620" y="431" fill="#c9d1d9" text-anchor="middle">file it upstream. be nice.</text><text x="620" y="450" fill="#8b949e" font-size="13" text-anchor="middle">reviewers are busy and also human.</text>
<text x="450.0" y="503" fill="#8b949e" font-size="13" text-anchor="middle">it is never the compiler. except when it is. be ready.</text>
