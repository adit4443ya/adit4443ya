<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="900" height="380" rx="12" fill="#0d1117"/>
<text x="450.0" y="36" fill="#c9d1d9" font-size="18" font-weight="bold" text-anchor="middle">Benchmarking: a love story</text>
<text x="60" y="100" fill="#c9d1d9">run 1 · laptop on battery · 14 tabs open</text>
<rect x="60" y="110" width="0" height="30" rx="5" fill="#d29922"><animate attributeName="width" from="0" to="544" dur="1s" begin="0.4s" fill="freeze"/></rect>
<text x="618" y="131" fill="#d29922" opacity="0"><set attributeName="opacity" to="1" begin="1.4s" fill="freeze"/>3.20x  (screenshotted)</text>
<text x="60" y="182" fill="#c9d1d9">run 2 · same machine · closed the tabs</text>
<rect x="60" y="192" width="0" height="30" rx="5" fill="#8b949e"><animate attributeName="width" from="0" to="156" dur="1s" begin="1.3s" fill="freeze"/></rect>
<text x="244" y="213" fill="#8b949e" opacity="0"><set attributeName="opacity" to="1" begin="2.3s" fill="freeze"/>0.92x</text>
<text x="60" y="264" fill="#c9d1d9">pinned cores · perf governor · n=30 · variance reported</text>
<rect x="60" y="274" width="0" height="30" rx="5" fill="#3fb950"><animate attributeName="width" from="0" to="177" dur="1s" begin="2.2s" fill="freeze"/></rect>
<text x="251" y="295" fill="#3fb950" opacity="0"><set attributeName="opacity" to="1" begin="3.2s" fill="freeze"/>1.04x  &lt;- the real number</text>
<line x1="230" y1="76" x2="230" y2="330" stroke="#8b949e" stroke-dasharray="4 4"/><text x="230" y="70" fill="#8b949e" font-size="12" text-anchor="middle">baseline 1.0x</text>
<text x="450.0" y="362" fill="#8b949e" font-size="13" text-anchor="middle">the honest number is always the least exciting one.</text></svg>